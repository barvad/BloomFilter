name: Publish NuGet package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Restore
        run: dotnet restore BloomFilter.slnx

      - name: Build
        run: dotnet build BloomFilter.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test BloomFilter.slnx --configuration Release --no-build

      - name: Pack library
        run: dotnet pack src/BloomFilter/BloomFilter.csproj --configuration Release --no-build --output ./artifacts

      - name: NuGet login (OIDC trusted publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: barvad

      - name: Publish package
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
